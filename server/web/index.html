<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F6F9" />
  <title>CodySafe</title>
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/brand/favicon.png" sizes="256x256" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="web/guard.css" />
  <link rel="stylesheet" href="web/pet.css" />
</head>
<body>
  <script>
    // 미리보기 안의 화면은 모바일로만 보여 주고, PC 화면의 접힘 상태는 미리 적용해 깜빡이지 않게 합니다.
    if (window.self !== window.top) document.body.classList.add('embedded');
    try { if (localStorage.getItem('guard.previewClosed') === '1') document.body.classList.add('preview-closed'); } catch (e) { }
  </script>
  <div class="stage">
    <aside class="intro" hidden><ol id="introList"></ol></aside>
    <button class="preview-toggle" id="previewToggle" onclick="togglePreview()" aria-controls="webPreview"></button>
    <aside class="web-preview" id="webPreview">
      <div class="preview-phone">
        <div class="preview-bar"><span id="previewClock"></span><i></i><span class="sb-icons"></span></div>
        <iframe id="previewFrame" title="모바일 화면 미리보기"></iframe>
      </div>
    </aside>
    <div class="phone">
      <div class="screen">
        <div class="statusbar">
          <span class="sb-time" id="sbTime">9:41</span>
          <span class="sb-island"></span>
          <span class="sb-icons"></span>
        </div>
        <main id="view"></main>
        <nav id="tabbar"></nav>
        <div id="sheet"></div>
        <div id="alertLayer"></div>
        <div id="toast"></div>
      </div>
    </div>
  </div>
  <input type="file" id="filePick" hidden />
  <input type="file" id="dirPick" webkitdirectory multiple hidden />

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="web/sim.js"></script>
  <script src="web/trends.js"></script>
  <script src="web/pet.js"></script>
  <script src="web/guard.js"></script>
  <script src="web/sim2.js"></script>
</body>
</html>
