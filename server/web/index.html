<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F6FC" />
  <title>CodySafe</title>
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/brand/favicon.png" sizes="256x256" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="web/guard.css" />
</head>
<body>
  <div class="stage">
    <aside class="intro" hidden><ol id="introList"></ol></aside>
    <div class="phone">
      <div class="screen">
        <div class="statusbar">
          <span class="sb-time" id="sbTime">9:41</span>
          <span class="sb-island"></span>
          <span class="sb-icons"></span>
        </div>
        <main id="view"></main>
        <nav id="tabbar"></nav>
        <div id="sheet"></div>
        <div id="alertLayer"></div>
        <div id="toast"></div>
      </div>
    </div>
  </div>
  <input type="file" id="filePick" hidden />
  <input type="file" id="dirPick" webkitdirectory multiple hidden />

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="web/guard.js"></script>
</body>
</html>
