<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2F5BFF" />
  <title>CodySafe — AI 사기 예방 플랫폼</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css?v=20261031c" />
</head>
<body>
  <div class="stage">
    <!-- 데스크톱 발표용 소개 패널 -->
    <aside class="intro">
      <div class="intro-brand">
        <img src="assets/logo.svg" alt="" width="52" height="52" />
        <div>
          <div class="intro-name">CodySafe</div>
          <div class="intro-tag">국민 AI 사기 대응력 향상 플랫폼</div>
        </div>
      </div>
      <h1 class="intro-slogan">AI 사기는 <em>미리 경험</em>하고,<br/>피해도 <em>미리 예방</em>한다.</h1>
      <p class="intro-desc">체험형 예방 훈련과 실시간 방어를 하나로. 아래 기능을 누르면 오른쪽 앱 화면으로 바로 이동합니다.</p>
      <ol class="intro-list" id="introList"></ol>
    </aside>

    <div class="phone">
      <div class="screen">
        <div class="statusbar">
          <span class="sb-time" id="sbTime">9:41</span>
          <span class="sb-island"></span>
          <span class="sb-icons">
            <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.6"/><rect x="22.5" y="4" width="1.6" height="4" rx=".8" opacity=".4"/></svg>
          </span>
        </div>
        <main id="view"></main>
        <nav id="tabbar"></nav>
        <div id="sheet"></div>
        <div id="alertLayer"></div>
        <div id="toast"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js?v=20261031c"></script>
  <script src="js/app.js?v=20261031c"></script>
</body>
</html>
